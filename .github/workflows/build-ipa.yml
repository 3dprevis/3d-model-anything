name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/house-capture
        run: xcodegen generate

      - name: Build unsigned Release
        working-directory: apps/house-capture
        run: |
          xcodebuild -project HouseCapture.xcodeproj -scheme HouseCapture \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: apps/house-capture
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/HouseCapture.app"
          test -d "$APP_PATH"
          rm -rf Payload HouseCapture-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          # --keepParent is required: the zip root must contain Payload/HouseCapture.app,
          # not the bare .app (a zip rooted at HouseCapture.app breaks Sideloadly).
          ditto -c -k --keepParent Payload HouseCapture-unsigned.ipa
          ls -lh HouseCapture-unsigned.ipa

      - name: Verify IPA
        working-directory: apps/house-capture
        run: |
          echo "== IPA structure =="
          unzip -l HouseCapture-unsigned.ipa
          # Layout assertions on the zip itself: Payload/HouseCapture.app must be at the
          # zip root, and the bare .app must NOT be.
          unzip -l HouseCapture-unsigned.ipa | grep -q " Payload/HouseCapture.app/$"
          ! unzip -l HouseCapture-unsigned.ipa | grep -q " HouseCapture.app/$"
          # Plist is read from INSIDE the zip, not from the build directory.
          unzip -p HouseCapture-unsigned.ipa Payload/HouseCapture.app/Info.plist > /tmp/IPA-Info.plist
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" /tmp/IPA-Info.plist)
          MINOS=$(/usr/libexec/PlistBuddy -c "Print MinimumOSVersion" /tmp/IPA-Info.plist)
          SHARING=$(/usr/libexec/PlistBuddy -c "Print UIFileSharingEnabled" /tmp/IPA-Info.plist)
          echo "CFBundleIdentifier: $BID"
          echo "MinimumOSVersion: $MINOS"
          echo "UIFileSharingEnabled: $SHARING"
          test "$BID" = "com.wesbos.housecapture"
          test "$MINOS" = "17.0"
          test "$SHARING" = "true"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HouseCapture-unsigned
          path: apps/house-capture/HouseCapture-unsigned.ipa
          retention-days: 7
